services:
  cat-agent:
    build: .
    image: cat-agent:latest
    container_name: cat-agent
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-8010}:8010"
    volumes:
      - ./app.py:/app/app.py
      - ./core:/app/core
      - ./web:/app/web
      - ./data:/app/data
    restart: unless-stopped

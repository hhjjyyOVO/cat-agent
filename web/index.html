<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cat Agent - 宠物体况咨询</title>
<style>
:root {
  --bg: #eef2f5;
  --panel: #ffffff;
  --text: #172033;
  --muted: #64748b;
  --line: #d9e1ea;
  --primary: #176b87;
  --primary-dark: #0f536a;
  --accent: #d97706;
  --soft: #f7fafc;
  --user: #eef7f5;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
}
button, textarea { font: inherit; }
.app {
  width: min(980px, 100%);
  height: 100dvh;
  margin: 0 auto;
  background: var(--panel);
  display: flex;
  flex-direction: column;
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
}
.topbar {
  min-height: 68px;
  padding: 0 20px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}
.brand {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.brand strong {
  font-size: 18px;
}
.brand span {
  color: var(--muted);
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.status {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 13px;
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #16a34a;
}
.dot.busy { background: var(--accent); }
.new-chat {
  border: 1px solid var(--line);
  background: #fff;
  color: var(--text);
  border-radius: 6px;
  height: 36px;
  padding: 0 12px;
  cursor: pointer;
}
.new-chat:hover { background: var(--soft); }
.toggle-feed {
  border: 1px solid var(--line);
  background: #fff;
  color: var(--text);
  border-radius: 6px;
  height: 36px;
  padding: 0 12px;
  cursor: pointer;
}
.toggle-feed:hover { background: var(--soft); }
.lab-shell {
  border-bottom: 1px solid var(--line);
  background: #fcfdff;
}
.lab-summary {
  list-style: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 18px;
  cursor: pointer;
}
.lab-summary::-webkit-details-marker { display: none; }
.lab-title {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.lab-title strong {
  font-size: 16px;
}
.lab-title span {
  color: var(--muted);
  font-size: 13px;
}
.lab-state {
  color: var(--muted);
  font-size: 13px;
  flex-shrink: 0;
}
.lab-body {
  padding: 0 18px 14px;
}
.lab-inner {
  width: min(780px, 100%);
  margin: 0 auto;
}
.lab-form {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 12px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}
.field label {
  font-size: 12px;
  color: var(--muted);
}
.field input,
.field select,
.field textarea {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  outline: none;
  background: #fff;
}
.field textarea {
  min-height: 84px;
  resize: vertical;
}
.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(23, 107, 135, .12);
}
.span-12 { grid-column: span 12; }
.span-8 { grid-column: span 8; }
.span-6 { grid-column: span 6; }
.span-4 { grid-column: span 4; }
.span-3 { grid-column: span 3; }
.file-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.file-name {
  min-width: 0;
  color: var(--muted);
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.lab-actions {
  grid-column: span 12;
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}
.run-btn {
  height: 40px;
  border: 0;
  border-radius: 6px;
  padding: 0 14px;
  cursor: pointer;
  color: #fff;
  background: var(--primary);
  font-weight: 700;
}
.run-btn:hover { background: var(--primary-dark); }
.run-btn:disabled {
  opacity: .55;
  cursor: default;
}
.lab-output {
  margin-top: 12px;
  border-top: 1px solid var(--line);
  padding-top: 12px;
  white-space: pre-wrap;
  line-height: 1.65;
  font-size: 14px;
  color: var(--text);
}
.lab-output.empty {
  color: var(--muted);
}
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 28px 22px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.message {
  width: min(780px, 100%);
  margin: 0 auto;
}
.message.user { text-align: right; }
.role {
  color: var(--muted);
  font-size: 13px;
  font-weight: 650;
  margin-bottom: 8px;
}
.content {
  line-height: 1.7;
  font-size: 15px;
  white-space: pre-wrap;
  word-break: break-word;
}
.message.user .content {
  display: inline-block;
  max-width: min(690px, 100%);
  text-align: left;
  background: var(--user);
  border: 1px solid #cfe4df;
  border-radius: 8px;
  padding: 10px 12px;
}
.message.assistant .content {
  padding-right: 8px;
}
.tools {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}
.message.user .tools { justify-content: flex-end; }
.copy {
  height: 28px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 13px;
  padding: 0 8px;
}
.copy:hover {
  border-color: var(--line);
  background: var(--soft);
  color: var(--text);
}
.composer-wrap {
  border-top: 1px solid var(--line);
  padding: 12px 18px 16px;
  background: #fff;
}
.composer {
  width: min(780px, 100%);
  margin: 0 auto;
  display: flex;
  gap: 10px;
  align-items: flex-end;
}
textarea {
  flex: 1;
  min-height: 46px;
  max-height: 132px;
  resize: none;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 11px 13px;
  outline: none;
  line-height: 1.45;
}
textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(23, 107, 135, .12);
}
.send {
  width: 52px;
  height: 46px;
  border: 0;
  border-radius: 8px;
  color: #fff;
  background: var(--primary);
  cursor: pointer;
  font-weight: 700;
}
.send:hover { background: var(--primary-dark); }
.send:disabled {
  opacity: .55;
  cursor: default;
}
@media (max-width: 640px) {
  .app { border: 0; }
  .topbar {
    min-height: 62px;
    padding: 0 14px;
  }
  .brand span { display: none; }
  .toggle-feed {
    display: none;
  }
  .lab-summary {
    padding: 12px 14px;
  }
  .lab-form {
    grid-template-columns: repeat(1, minmax(0, 1fr));
  }
  .span-12, .span-8, .span-6, .span-4, .span-3 {
    grid-column: span 1;
  }
  .messages {
    padding: 16px 14px;
    gap: 20px;
  }
  .composer-wrap { padding: 10px 12px 12px; }
  .send {
    width: 48px;
    min-width: 48px;
  }
}
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand">
      <strong>Cat Agent</strong>
      <span>宠物体况与体重管理咨询</span>
    </div>
    <div class="actions">
      <span class="status"><i id="dot" class="dot"></i><span id="status">在线</span></span>
      <button id="feedingToggle" class="toggle-feed" type="button" title="Ctrl+Alt+F">喂食</button>
      <button class="new-chat" type="button" onclick="newChat()">新对话</button>
    </div>
  </header>

  <details id="feedingPanel" class="lab-shell">
    <summary class="lab-summary">
      <div class="lab-title">
        <strong>喂食建议</strong>
        <span>上传营养成分参考表，结合宠物数据给出每日喂食量</span>
      </div>
      <div id="feedingState" class="lab-state">收起</div>
    </summary>
    <div class="lab-body">
    <div class="lab-inner">
      <form id="feedingForm" class="lab-form">
        <div class="field span-12">
          <label for="petText">宠物信息</label>
          <textarea id="petText" placeholder="可直接写：我家英短，5岁，6.8kg，已绝育，BCS 7/9，平时不太爱动"></textarea>
        </div>
        <div class="field span-8">
          <label for="labelText">营养表 OCR 文本（可选）</label>
          <textarea id="labelText" placeholder="如果识别不清，可以把 OCR 文本粘贴到这里"></textarea>
        </div>
        <div class="field span-4">
          <label for="foodImage">营养表照片</label>
          <div class="file-row">
            <input id="foodImage" type="file" accept="image/*" capture="environment">
          </div>
          <div id="foodImageName" class="file-name">未选择图片</div>
        </div>
        <div class="field span-3">
          <label for="goal">目标</label>
          <select id="goal">
            <option value="auto">自动判断</option>
            <option value="maintain">维持体重</option>
            <option value="weight_loss">减重/控肥</option>
            <option value="gain">增重/恢复</option>
            <option value="growth">幼宠成长</option>
          </select>
        </div>
        <div class="field span-3">
          <label for="mealsPerDay">每日喂几餐</label>
          <input id="mealsPerDay" type="number" min="1" max="6" value="2">
        </div>
        <div class="lab-actions">
          <button id="feedingSubmit" class="run-btn" type="submit">生成建议</button>
        </div>
      </form>
      <pre id="feedingOutput" class="lab-output empty">上传营养表照片后，这里会显示喂食建议。</pre>
    </div>
    </div>
  </details>

  <section id="messages" class="messages">
    <div class="message assistant">
      <div class="role">Cat Agent</div>
      <div class="content">你好，我可以帮你初步判断宠物是否有超重或肥胖风险。请告诉我宠物种类、年龄、体重、是否绝育，以及 BCS 体况评分；如果不知道 BCS，也可以描述肋骨是否容易摸到、腰线是否明显、肚子是否下垂。</div>
      <div class="tools">
        <button class="copy" type="button" onclick="copyMessage(this)">复制</button>
      </div>
    </div>
  </section>

  <div class="composer-wrap">
    <form id="composer" class="composer">
      <textarea id="input" rows="1" placeholder="例如：我家英短，5岁，6.8kg，已绝育，BCS 7/9，平时不太爱动"></textarea>
      <button id="send" class="send" type="submit" aria-label="发送">发</button>
    </form>
  </div>
</main>

<script>
const streamApi = "/api/chat/stream";
const feedingApi = "/api/ai/feeding";
const resetApi = "/api/session/reset";
const messages = document.getElementById("messages");
const input = document.getElementById("input");
const sendButton = document.getElementById("send");
const feedingForm = document.getElementById("feedingForm");
const feedingPanel = document.getElementById("feedingPanel");
const feedingToggle = document.getElementById("feedingToggle");
const feedingState = document.getElementById("feedingState");
const foodImage = document.getElementById("foodImage");
const foodImageName = document.getElementById("foodImageName");
const petText = document.getElementById("petText");
const labelText = document.getElementById("labelText");
const goalSelect = document.getElementById("goal");
const mealsPerDay = document.getElementById("mealsPerDay");
const feedingSubmit = document.getElementById("feedingSubmit");
const feedingOutput = document.getElementById("feedingOutput");
const dot = document.getElementById("dot");
const statusText = document.getElementById("status");
let sessionId = localStorage.getItem("cat_agent_session_id") || crypto.randomUUID();
let loading = false;
let feedingLoading = false;
localStorage.setItem("cat_agent_session_id", sessionId);

function setBusy(isBusy) {
  loading = isBusy;
  sendButton.disabled = isBusy;
  dot.className = isBusy ? "dot busy" : "dot";
  statusText.textContent = isBusy ? "分析中" : "在线";
}

function setFeedingBusy(isBusy) {
  feedingLoading = isBusy;
  feedingSubmit.disabled = isBusy;
  feedingSubmit.textContent = isBusy ? "处理中" : "生成建议";
}

function setFeedingPanelOpen(isOpen, scroll = false) {
  feedingPanel.open = isOpen;
  feedingState.textContent = isOpen ? "收起" : "展开";
  feedingToggle.textContent = isOpen ? "收起" : "喂食";
  if (isOpen && scroll) {
    feedingPanel.scrollIntoView({behavior: "smooth", block: "start"});
  }
}

function escapeHtml(text) {
  return text.replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[ch]));
}

function addMessage(role, text) {
  const item = document.createElement("div");
  item.className = `message ${role}`;
  const roleName = role === "user" ? "你" : "Cat Agent";
  const tools = role === "assistant"
    ? '<div class="tools"><button class="copy" type="button" onclick="copyMessage(this)">复制</button></div>'
    : "";
  item.innerHTML = `
    <div class="role">${roleName}</div>
    <div class="content">${escapeHtml(text)}</div>
    ${tools}
  `;
  messages.appendChild(item);
  messages.scrollTop = messages.scrollHeight;
  return item.querySelector(".content");
}

function setMessageText(content, text) {
  content.textContent = text;
  messages.scrollTop = messages.scrollHeight;
}

async function copyMessage(button) {
  const message = button.closest(".message");
  const content = message?.querySelector(".content");
  const text = content?.textContent || "";
  if (!text) return;
  try {
    await navigator.clipboard.writeText(text);
    button.textContent = "已复制";
  } catch {
    button.textContent = "复制失败";
  }
  window.setTimeout(() => {
    button.textContent = "复制";
  }, 1200);
}

function introText() {
  return "新对话已开始。请告诉我宠物种类、年龄、体重、是否绝育和 BCS；也可以直接描述体型和最近的饮食活动。";
}

function resetIntro(text) {
  messages.innerHTML = "";
  addMessage("assistant", text);
}

async function newChat() {
  const oldSessionId = sessionId;
  sessionId = crypto.randomUUID();
  localStorage.setItem("cat_agent_session_id", sessionId);
  resetIntro(introText());
  input.focus();
  try {
    await fetch(resetApi, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({session_id: oldSessionId})
    });
  } catch {
    // Session cleanup is best-effort; the new local session is already active.
  }
}

feedingToggle.addEventListener("click", () => {
  setFeedingPanelOpen(!feedingPanel.open, true);
});

feedingPanel.addEventListener("toggle", () => {
  setFeedingPanelOpen(feedingPanel.open, false);
});

document.addEventListener("keydown", (event) => {
  if (event.ctrlKey && event.altKey && event.key.toLowerCase() === "f") {
    event.preventDefault();
    setFeedingPanelOpen(!feedingPanel.open, true);
  }
});

setFeedingPanelOpen(false, false);

foodImage.addEventListener("change", () => {
  const file = foodImage.files && foodImage.files[0];
  foodImageName.textContent = file ? file.name : "未选择图片";
});

feedingForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  if (feedingLoading) return;

  const payload = new FormData();
  payload.append("session_id", sessionId);
  payload.append("pet_text", petText.value.trim());
  payload.append("label_text", labelText.value.trim());
  payload.append("goal", goalSelect.value);
  payload.append("meals_per_day", mealsPerDay.value || "2");
  if (foodImage.files && foodImage.files[0]) {
    payload.append("image", foodImage.files[0]);
  }

  setFeedingBusy(true);
  feedingOutput.classList.add("empty");
  feedingOutput.textContent = "正在分析营养表和宠物信息...";

  try {
    const response = await fetch(feedingApi, {
      method: "POST",
      body: payload
    });
    const data = await response.json();
    if (!response.ok) {
      feedingOutput.textContent = data.error || "喂食建议接口暂时不可用。";
      return;
    }
    feedingOutput.classList.toggle("empty", false);
    feedingOutput.textContent = data.reply_text || "没有生成可用的建议。";
  } catch (error) {
    feedingOutput.classList.toggle("empty", false);
    feedingOutput.textContent = "连接喂食建议接口失败，请确认服务已经启动。";
  } finally {
    setFeedingBusy(false);
  }
});

async function sendMessage() {
  const text = input.value.trim();
  if (!text || loading) return;

  input.value = "";
  input.style.height = "auto";
  addMessage("user", text);
  setBusy(true);
  const assistantContent = addMessage("assistant", "");

  try {
    const streamed = await sendStream(text, assistantContent);
    if (!streamed.ok) {
      setMessageText(assistantContent, streamed.message || "暂时没有收到回复，请稍后再试。");
    }
  } catch (error) {
    setMessageText(assistantContent, "连接服务失败，请确认后端服务已经启动。");
  } finally {
    setBusy(false);
    input.focus();
  }
}

async function sendStream(text, content) {
  const response = await fetch(streamApi, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({session_id: sessionId, message: text})
  });
  const contentType = response.headers.get("Content-Type") || "";
  if (!response.ok || !contentType.includes("text/event-stream") || !response.body) {
    let message = "服务暂不可用。";
    try {
      const data = await response.json();
      message = data.error || data.message || message;
    } catch {
      // Keep the generic message when the server does not return JSON.
    }
    return {ok: false, message};
  }

  const reader = response.body.getReader();
  const decoder = new TextDecoder("utf-8");
  let buffer = "";
  let textSoFar = "";
  let sawEvent = false;

  while (true) {
    const {value, done} = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, {stream: true});
    const parts = buffer.split("\n\n");
    buffer = parts.pop() || "";
    for (const part of parts) {
      const event = parseSse(part);
      if (!event) continue;
      sawEvent = true;
      if (event.type === "error") {
        const message = event.data || "流式接口返回错误。";
        setMessageText(content, message);
        return {ok: false, message};
      }
      const nextText = applyChatEvent(event, textSoFar);
      if (nextText !== null) {
        textSoFar = nextText;
        setMessageText(content, textSoFar);
      }
    }
  }

  if (!textSoFar && sawEvent) {
    setMessageText(content, "没有收到文本回复。");
  }
  return {ok: sawEvent, message: sawEvent ? "" : "没有收到流式事件。"};
}

function parseSse(raw) {
  const dataLines = raw.split(/\r?\n/)
    .filter((line) => line.startsWith("data:"))
    .map((line) => line.slice(5).trimStart());
  if (!dataLines.length) return null;
  const data = dataLines.join("\n");
  if (!data || data === "[DONE]") return null;
  try {
    return JSON.parse(data);
  } catch {
    return {type: "plain", data};
  }
}

function applyChatEvent(event, currentText) {
  if (event.type === "plain") {
    return currentText + (event.data || "");
  }
  if (event.type === "complete") {
    return event.data || currentText;
  }
  if (event.type === "run_snapshot" && event.data && event.data.content) {
    return extractContentText(event.data.content) || currentText;
  }
  return null;
}

function extractContentText(content) {
  if (typeof content === "string") return content;
  const parts = Array.isArray(content?.message) ? content.message : Array.isArray(content) ? content : [];
  return parts.map((part) => {
    if (typeof part === "string") return part;
    if (part?.type === "text") return part?.data?.text || part?.text || "";
    if (part?.type) return `[${part.type}]`;
    return "";
  }).join("");
}

document.getElementById("composer").addEventListener("submit", (event) => {
  event.preventDefault();
  sendMessage();
});

input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 132) + "px";
});
</script>
</body>
</html>
